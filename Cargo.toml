[package]
name = "appmem"
version = "0.1.3"
edition = "2024"
description = "See which macOS app is using your memory, grouped per app, in the terminal"
license = "MIT"
repository = "https://github.com/FraCata00/appmem"
readme = "README.md"
keywords = ["macos", "memory", "tui", "activity-monitor", "process"]
exclude = ["/docs", "/.github"]
categories = ["command-line-utilities", "os::macos-apis"]

[dependencies]
libc = "0.2.191"
plist = "1.10.3"
ratatui = "0.30.2"
unicode-width = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
